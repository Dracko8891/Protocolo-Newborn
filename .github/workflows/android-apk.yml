name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "manifest.json"
      - "narration_manifest.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build PROTOCOLO NEWBORN APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Build game frontend
        run: npm run build -- --base=./

      - name: Package game into Android assets
        run: |
          test -s dist/index.html
          mkdir -p app/src/main/assets/game
          cp -R dist/. app/src/main/assets/game/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Protocolo Newborn,O=Dracko8891,C=BR"

      - name: Build signed installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and stage Protocolo-Newborn.apk
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist-apk
          cp "$APK" dist-apk/Protocolo-Newborn.apk
          file dist-apk/Protocolo-Newborn.apk
          sha256sum dist-apk/Protocolo-Newborn.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOLO-NEWBORN-Android-APK
          path: dist-apk/Protocolo-Newborn.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Protocolo-Newborn.apk to Release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Protocolo Newborn · APK Base"
          body: "APK Base leve do Protocolo Newborn (Android). Baixe, instale e faça o download dos capítulos diretamente no jogo."
          make_latest: true
          files: |
            dist-apk/Protocolo-Newborn.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
